[project]
name = "247sales-agents"
version = "0.1.0"
description = "AI agents for monitoring agentic AI trends and Twitter SEO/marketing tips"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tweepy>=4.14",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.0",
    "sumy>=0.11",
    "datasketch>=1.6",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "nltk>=3.8",
    "lxml>=5.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
run-agents = "src.main:main"
